name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit tests (no external services)
    runs-on: ubuntu-latest
    env:
      SBT_OPTS: -Xmx4G
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: coursier/cache-action@v6
      - uses: sbt/setup-sbt@v1
        with:
          sbt-version: '1.13.0'
      - name: Compile
        run: sbt -batch compile
      - name: Test pure modules
        run: sbt -batch "core/test" "staticIr/test" "static/test" "staticExt/test" "dynamic/test" "slf4j/test" "springBootStarter/test"

  jdbc:
    name: JDBC integration tests (PostgreSQL + MySQL)
    runs-on: ubuntu-latest
    env:
      SBT_OPTS: -Xmx4G
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123456"
          POSTGRES_DB: sqala_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: sqala_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: coursier/cache-action@v6
      - uses: sbt/setup-sbt@v1
        with:
          sbt-version: '1.13.0'
      - name: Switch MySQL root to native password auth
        run: >
          docker exec ${{ job.services.mysql.id }} mysql -uroot -p123456 -e
          "ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY '123456';
          FLUSH PRIVILEGES;"
      - name: Test jdbc module against live services
        run: sbt -batch "jdbc/test"
